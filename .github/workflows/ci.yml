name: CI

on:
  push:
    branches: [initial-setup, main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uat
          POSTGRES_PASSWORD: uat
          POSTGRES_DB: uat_test_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uat -d uat_test_intelligence"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://uat:uat@localhost:5432/uat_test_intelligence
      API_TOKEN: dev-token
      APP_ENV: demo
      LLM_PROVIDER: none
      NOTIFICATIONS_ENABLED: "false"
    defaults:
      run:
        working-directory: services/test-manager-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/test-manager-api/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
