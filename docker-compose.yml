name: uat-test-intelligence

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uat}
      POSTGRES_DB: ${POSTGRES_DB:-uat_test_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uat} -d ${POSTGRES_DB:-uat_test_intelligence}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uat}:${POSTGRES_PASSWORD:-uat}@db:5432/${POSTGRES_DB:-uat_test_intelligence}
      API_TOKEN: ${API_TOKEN:-dev-token}
      APP_ENV: ${APP_ENV:-demo}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      API_RUNNER_URL: http://api-tests:5001
      WEB_RUNNER_URL: http://web-tests:6000
      REPORTS_ROOT: /srv/api/reports
      STORAGE_LOCAL_ROOT: /srv/api/data
      REPORT_TEMPLATES_DIR: /srv/api/reports-templates
      REPORT_ENGINE: ${REPORT_ENGINE:-manual}
      REPORT_COMPANY_NAME: ${REPORT_COMPANY_NAME:-Acme Corp}
      REPORT_PRIMARY_COLOR: ${REPORT_PRIMARY_COLOR:-#0f4c81}
      REPORT_SECONDARY_COLOR: ${REPORT_SECONDARY_COLOR:-#6c757d}
      REPORT_FOOTER: ${REPORT_FOOTER:-Confidential - generated by UAT Test Intelligence Platform}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-uat@example.com}
      NOTIFICATION_RECIPIENTS: ${NOTIFICATION_RECIPIENTS:-}
      AZURE_DEVOPS_ORG: ${AZURE_DEVOPS_ORG:-}
      AZURE_DEVOPS_PROJECT: ${AZURE_DEVOPS_PROJECT:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
    volumes:
      - reports:/srv/api/reports
      - generated_reports:/srv/api/reports/generated
    ports:
      - "7000:7000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:7000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  weather:
    build:
      context: .
      dockerfile: docker/weather.Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

  api-tests:
    build:
      context: .
      dockerfile: docker/api-tests.Dockerfile
    environment:
      API_TESTS_WEATHER_URL: http://weather:5000
    volumes:
      - reports:/srv/api-tests/reports
    ports:
      - "5001:5001"
    depends_on:
      - weather
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    environment:
      WEATHER_URL: http://weather:5000
    ports:
      - "8000:8000"
    depends_on:
      - weather
    restart: unless-stopped

  web-tests:
    build:
      context: .
      dockerfile: docker/web-tests.Dockerfile
    environment:
      WEBAPP_URL: http://webapp:8000
    volumes:
      - reports:/srv/web-tests/reports
      - screenshots:/srv/web-tests/reports/screenshots
      - videos:/srv/web-tests/reports/videos
      - traces:/srv/web-tests/reports/traces
    ports:
      - "6000:6000"
      - "6001:6001"
    depends_on:
      - webapp
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_TOKEN: ${API_TOKEN:-dev-token}
    ports:
      - "7001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  reports:
  generated_reports:
  screenshots:
  videos:
  traces:
